[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cctl"
version = "0.3.0"
description = "Universal cloud CLI — query, diagnose, and fix AWS, Azure, and GCP with AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [
    { name = "hgutti", email = "cloudctlhq@gmail.com" }
]
keywords = [
    "cloud", "cli", "aws", "azure", "gcp",
    "multicloud", "devops", "sre", "cloudctl"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

dependencies = [
    "typer[all]>=0.12",
    "rich>=13.0",
    "boto3>=1.34",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
azure = [
    # Core
    "azure-identity>=1.16",
    "azure-mgmt-compute>=32.0",
    "azure-mgmt-storage>=21.0",
    "azure-mgmt-subscription>=3.0",
    "azure-mgmt-resource>=23.0",
    # Database
    "azure-mgmt-rdbms>=10.0",
    "azure-mgmt-sql>=3.0",
    "azure-mgmt-cosmosdb>=9.0",
    "azure-mgmt-redis>=14.0",
    # Compute extras
    "azure-mgmt-containerservice>=30.0",
    "azure-mgmt-containerinstance>=10.0",
    "azure-mgmt-web>=7.0",
    # Network
    "azure-mgmt-network>=25.0",
    "azure-mgmt-dns>=8.0",
    "azure-mgmt-apimanagement>=4.0",
    # IAM / Security
    "azure-mgmt-authorization>=4.0",
    "azure-mgmt-keyvault>=10.0",
    "azure-mgmt-msi>=7.0",
    "azure-mgmt-security>=5.0",
    # Containers / DevOps
    "azure-mgmt-containerregistry>=10.0",
    # Monitoring
    "azure-mgmt-monitor>=6.0",
    # Messaging / Integration
    "azure-mgmt-servicebus>=8.0",
    "azure-mgmt-eventhub>=10.0",
    "azure-mgmt-logic>=9.0",
    # AI / Analytics
    "azure-mgmt-cognitiveservices>=13.0",
    "azure-mgmt-synapse>=2.0",
    "azure-mgmt-datafactory>=4.0",
    # Cost
    "azure-mgmt-costmanagement>=4.0",
    # Backup
    "azure-mgmt-recoveryservices>=3.0",
]
gcp = [
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
    "google-cloud-storage>=2.0",
    "google-cloud-resource-manager>=1.10",
]
all-clouds = [
    "cctl[azure,gcp]",
]
all = ["cctl[gate-azure,gate-gcp,ai,mcp]"]
# Policy gate (every cloud change goes through it). Pinned: these decide
# what is allowed, so an upgrade is a reviewed change, not a resolver choice.
#   regopy   — OPA Rego evaluator (Microsoft rego-cpp), MIT
#   cedarpy  — Cedar authorization for approvals, Apache-2.0
#   cryptography — Ed25519 approval signatures, Apache-2.0/BSD
gate = [
    "regopy==1.5.2",
    "cedarpy==4.12.2",
    "cryptography>=46,<51",
]
# The control-plane HTTP service (cloudctl serve). State backends: DynamoDB uses
# boto3 (core); Cosmos DB needs azure-cosmos; Firestore needs google-cloud-firestore.
service = [
    "cctl[gate]",
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "PyJWT[crypto]==2.10.1",
]
service-azure = ["cctl[service,gate-azure]", "azure-cosmos>=4.7,<5"]
service-gcp = ["cctl[service,gate-gcp]", "google-cloud-firestore>=2.16,<3"]
# Native cloud guardrail checks and immutable audit sinks for Azure and GCP.
gate-azure = ["cctl[gate,azure]", "azure-mgmt-policyinsights>=1.0", "azure-storage-blob>=12.19"]
gate-gcp = ["cctl[gate,gcp]"]
mcp = ["mcp>=1.0.0"]
ai  = ["anthropic>=0.30", "openai>=1.0", "requests>=2.31", "pydantic>=2.0", "instructor>=1.0", "langgraph"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
cloudctl     = "cloudctl.main:main"
cloudctl-mcp = "cloudctl.mcp.server:sync_main"

[tool.hatch.build.targets.wheel]
packages = ["cloudctl"]
# The gate's built-in policy (Rego, YAML rules, Cedar) ships inside the package.
artifacts = ["cloudctl/gate/**/*.rego", "cloudctl/gate/**/*.yaml", "cloudctl/gate/**/*.cedar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cloudctl --cov-report=xml:coverage.xml --cov-report=term-missing"
# tests/e2e/ is internal-only live-AWS scenario code, not part of the unit
# suite — and its Lambda handlers vendor their own third-party deps
# (e.g. streaming-etl/handlers/producer/colorama) whose bundled test files
# collide with the venv's own copy during collection.
norecursedirs = ["tests/e2e"]

[tool.coverage.run]
omit = [
    "cloudctl/providers/aws/provider.py",
    "cloudctl/providers/azure/provider.py",
    "cloudctl/providers/gcp/provider.py",
    "cloudctl/ai/*.py",
    "cloudctl/ai/prompts/*.py",
    "cloudctl/fixers/*.py",
    "cloudctl/fixers/aws/*.py",
    "cloudctl/fixers/azure/*.py",
    "cloudctl/fixers/gcp/*.py",
    "cloudctl/mcp/*.py",
    "cloudctl/mcp/tools/*.py",
    "cloudctl/debug/*.py",
    "cloudctl/agent/*.py",
    "cloudctl/commands/mcp_cmd.py",
    "cloudctl/commands/debug_cmd.py",
    "cloudctl/commands/agent_cmd.py",
    "cloudctl/commands/ask.py",
    "cloudctl/commands/feedback_cmd.py",
    "cloudctl/config/init_wizard.py",
]

[project.urls]
Homepage   = "https://github.com/cloudctlio/cloudctl"
Repository = "https://github.com/cloudctlio/cloudctl"
Issues     = "https://github.com/cloudctlio/cloudctl/issues"
Changelog  = "https://github.com/cloudctlio/cloudctl/releases"

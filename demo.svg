<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520">
  <defs>
    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; }
      .sz12 { font-size: 12px; }
      .sz13 { font-size: 13px; }
      .sz11 { font-size: 11px; }

      .c-white   { fill: #cdd6f4; }
      .c-green   { fill: #a6e3a1; }
      .c-yellow  { fill: #f9e2af; }
      .c-blue    { fill: #89b4fa; }
      .c-cyan    { fill: #89dceb; }
      .c-red     { fill: #f38ba8; }
      .c-purple  { fill: #cba6f7; }
      .c-dim     { fill: #6c7086; }
      .c-prompt  { fill: #89b4fa; }

      /*
       * Loop: 12s total, all animations use duration=12s iteration=infinite.
       * Each keyframe encodes: hidden → appear at T% → hold → fade 83%→91% → dark 91%→100%.
       * No SVG-level animation — eliminates the blink/flash entirely.
       *
       * Time → percentage (T / 12 * 100):
       *   cmd typing  0.4s→1.5s   = 3.3%→12.5%
       *   l1  1.7s = 14.2%   l2  2.1s = 17.5%   l3  2.5s = 20.8%
       *   l4  3.3s = 27.5%   l5  3.6s = 30.0%   l6  3.9s = 32.5%
       *   l7  4.2s = 35.0%   l8  4.6s = 38.3%   l9  4.9s = 40.8%
       *   l10 5.2s = 43.3%   l11 5.5s = 45.8%   l12 5.8s = 48.3%
       *   l13 6.1s = 50.8%   l14 6.4s = 53.3%
       */

      /* cmd: typing via clip-path */
      @keyframes k-cmd {
        0%, 3.3%  { clip-path: inset(0 100% 0 0); }
        12.5%     { clip-path: inset(0   0% 0 0); }
        83%       { clip-path: inset(0   0% 0 0); }
        91%       { clip-path: inset(0 100% 0 0); }
        100%      { clip-path: inset(0 100% 0 0); }
      }
      /* baseline: all animated elements start invisible so there's no flash
         at the loop boundary when the browser briefly drops the animation */
      .cmd  { clip-path: inset(0 100% 0 0); animation: k-cmd 12s linear infinite; }
      .cursor { opacity: 0; }
      .l1,.l2,.l3,.l3b,.l3c,.l4,.l5,.l6,.l7,
      .l8,.l9,.l10,.l11,.l12,.l13,.l14 { opacity: 0; }


      /* individual line keyframes — all share the same fade-out window */
      @keyframes k-l1  { 0%,14.2%{opacity:0} 14.4%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l2  { 0%,17.5%{opacity:0} 17.7%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l3  { 0%,20.8%{opacity:0} 21.0%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l4  { 0%,27.5%{opacity:0} 27.7%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l5  { 0%,30.0%{opacity:0} 30.2%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l6  { 0%,32.5%{opacity:0} 32.7%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l7  { 0%,35.0%{opacity:0} 35.2%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l8  { 0%,38.3%{opacity:0} 38.5%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l9  { 0%,40.8%{opacity:0} 41.0%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l10 { 0%,43.3%{opacity:0} 43.5%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l11 { 0%,45.8%{opacity:0} 46.0%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l12 { 0%,48.3%{opacity:0} 48.5%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l13 { 0%,50.8%{opacity:0} 51.0%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }
      @keyframes k-l14 { 0%,53.3%{opacity:0} 53.5%{opacity:1} 83%{opacity:1} 91%{opacity:0} 100%{opacity:0} }

      .l1  { animation: k-l1  12s linear infinite; }
      .l2  { animation: k-l2  12s linear infinite; }
      .l3  { animation: k-l3  12s linear infinite; }
      .l3b { animation: k-l3  12s linear infinite; }
      .l3c { animation: k-l3  12s linear infinite; }
      .l4  { animation: k-l4  12s linear infinite; }
      .l5  { animation: k-l5  12s linear infinite; }
      .l6  { animation: k-l6  12s linear infinite; }
      .l7  { animation: k-l7  12s linear infinite; }
      .l8  { animation: k-l8  12s linear infinite; }
      .l9  { animation: k-l9  12s linear infinite; }
      .l10 { animation: k-l10 12s linear infinite; }
      .l11 { animation: k-l11 12s linear infinite; }
      .l12 { animation: k-l12 12s linear infinite; }
      .l13 { animation: k-l13 12s linear infinite; }
      .l14 { animation: k-l14 12s linear infinite; }

    </style>
  </defs>

  <!-- window background -->
  <rect width="820" height="520" rx="12" fill="#1e1e2e"/>

  <!-- title bar -->
  <rect width="820" height="38" rx="12" fill="#313244"/>
  <rect y="26" width="820" height="12" fill="#313244"/>
  <circle cx="22" cy="19" r="6" fill="#f38ba8"/>
  <circle cx="42" cy="19" r="6" fill="#f9e2af"/>
  <circle cx="62" cy="19" r="6" fill="#a6e3a1"/>
  <text x="410" y="24" text-anchor="middle" class="mono sz11 c-dim">cloudctl — incident investigation</text>

  <!-- ── prompt + command ── -->
  <text x="20" y="72" class="mono sz13 c-prompt">❯</text>
  <text x="34" y="72" class="mono sz13 c-white cmd">cloudctl debug --agent "payments service 502s"</text>

  <!-- ── triage output ── -->
  <text x="20" y="98" class="mono sz12 c-dim l1">  Agent investigating: payments service 502s</text>

  <text x="20" y="120" class="mono sz12 l2">
    <tspan class="c-yellow">  ⟳  triage</tspan>
    <tspan class="c-dim">  →  generating 3 parallel hypotheses…</tspan>
  </text>

  <text x="20" y="141" class="mono sz12 l3">
    <tspan class="c-blue">  ├─ branch 1</tspan>
    <tspan class="c-dim">  ECS task memory / OOM kills</tspan>
  </text>
  <text x="20" y="158" class="mono sz12 l3b">
    <tspan class="c-blue">  ├─ branch 2</tspan>
    <tspan class="c-dim">  ALB target health / connection drain</tspan>
  </text>
  <text x="20" y="175" class="mono sz12 l3c">
    <tspan class="c-blue">  └─ branch 3</tspan>
    <tspan class="c-dim">  IAM role / downstream dependency</tspan>
  </text>

  <text x="20" y="197" class="mono sz12 l4">
    <tspan class="c-green">  ✓  branch 1</tspan>
    <tspan class="c-dim">  confirmed — ECS OOM kills on 3/4 tasks (15:02 UTC)</tspan>
  </text>
  <text x="20" y="214" class="mono sz12 l5">
    <tspan class="c-dim">  ✗  branch 2</tspan>
    <tspan class="c-dim">  ruled out — target health checks passing</tspan>
  </text>
  <text x="20" y="231" class="mono sz12 l6">
    <tspan class="c-dim">  ✗  branch 3</tspan>
    <tspan class="c-dim">  ruled out — IAM and dependencies nominal</tspan>
  </text>

  <text x="20" y="253" class="mono sz12 l7">
    <tspan class="c-yellow">  ⟳  synthesize + critique</tspan>
    <tspan class="c-dim">  →  validating conclusion…</tspan>
  </text>

  <!-- ── result box ── -->
  <text x="20" y="278" class="mono sz12 c-dim l8">  ╔══════════════╦═══════════════════════════════════════════════════════╗</text>
  <text x="20" y="295" class="mono sz12 l9">
    <tspan class="c-dim">  ║ </tspan><tspan class="c-yellow">STATUS</tspan><tspan class="c-dim">       ║ </tspan><tspan class="c-red">DEGRADED</tspan><tspan class="c-dim"> — ECS connection pool exhausted                  ║</tspan>
  </text>
  <text x="20" y="312" class="mono sz12 c-dim l9">  ╠══════════════╬═══════════════════════════════════════════════════════╣</text>
  <text x="20" y="329" class="mono sz12 l10">
    <tspan class="c-dim">  ║ </tspan><tspan class="c-yellow">CONFIDENCE</tspan><tspan class="c-dim">   ║ </tspan><tspan class="c-green">HIGH</tspan><tspan class="c-dim"> — CloudWatch 24h · ECS events · CloudTrail      ║</tspan>
  </text>
  <text x="20" y="346" class="mono sz12 c-dim l10">  ╠══════════════╬═══════════════════════════════════════════════════════╣</text>
  <text x="20" y="363" class="mono sz12 l11">
    <tspan class="c-dim">  ║ </tspan><tspan class="c-yellow">ROOT CAUSE</tspan><tspan class="c-dim">   ║ </tspan><tspan class="c-white">Memory hit 94% at 15:02 UTC → OOM kills on 3/4   ║</tspan>
  </text>
  <text x="20" y="380" class="mono sz12 l11">
    <tspan class="c-dim">  ║              ║ </tspan><tspan class="c-white">tasks → connection pool drained → 502s            ║</tspan>
  </text>
  <text x="20" y="397" class="mono sz12 c-dim l11">  ╠══════════════╬═══════════════════════════════════════════════════════╣</text>
  <text x="20" y="414" class="mono sz12 l12">
    <tspan class="c-dim">  ║ </tspan><tspan class="c-yellow">FIX (CDK)</tspan><tspan class="c-dim">    ║ </tspan><tspan class="c-cyan">taskDefinition.addContainer&#123; memoryLimitMiB: 2048 &#125;  ║</tspan>
  </text>
  <text x="20" y="431" class="mono sz12 l12">
    <tspan class="c-dim">  ║              ║ </tspan><tspan class="c-cyan">cdk deploy PaymentsStack                          ║</tspan>
  </text>
  <text x="20" y="448" class="mono sz12 c-dim l12">  ╠══════════════╬═══════════════════════════════════════════════════════╣</text>
  <text x="20" y="465" class="mono sz12 l13">
    <tspan class="c-dim">  ║ </tspan><tspan class="c-yellow">DEPLOYED VIA</tspan><tspan class="c-dim"> ║ </tspan><tspan class="c-purple">AWS CDK</tspan><tspan class="c-dim"> ⚠ direct changes overwritten on next deploy   ║</tspan>
  </text>
  <text x="20" y="482" class="mono sz12 c-dim l13">  ╚══════════════╩═══════════════════════════════════════════════════════╝</text>

  <text x="20" y="504" class="mono sz11 c-dim l14">  Report saved → ~/.cloudctl/incidents/2026-06-27T15-47-payments-502.md</text>
</svg>

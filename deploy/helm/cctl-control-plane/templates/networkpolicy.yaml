{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cctl.fullname" . }}
  labels: {{- include "cctl.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "cctl.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if .Values.networkPolicy.ingressFrom }}
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports: [{port: 8080, protocol: TCP}]
    {{- end }}
  egress:
    - to:                               # cluster DNS
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        {{- range .Values.networkPolicy.egressCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{port: 443, protocol: TCP}]
{{- end }}
